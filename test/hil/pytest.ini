[pytest]
markers =
    smoke: needs only console commands every firmware build has
    owner: needs the paired Telegram owner (messages are sent to that chat; some steps need the human to reply); skipped unless -m owner or EMBPET_HIL_OWNER=1
    loopback: needs OUTn->opto->IN wiring (EMBPET_LOOPBACK, default 0:10,1:20,2:21); skipped unless -m loopback or EMBPET_HIL_LOOPBACK=1
    slow: takes more than about 30 s (Wi-Fi outages, reboots)
